<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Task</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/costume.css}" rel="stylesheet">
</head>

<body>
<section class="bg-primary text-white py-4">
    <div class="container">
        <h1 class="text-center">Create a new Task</h1>
    </div>
</section>

<section class="bg-light py-4">
    <div class="container">
        <form th:action="@{/}" method="post">
            <div class="mb-3">
                <label for="name" class="form-label">Name:</label>
                <input type="text" class="form-control" id="name" name="name" th:field="*{task.name}">
            </div>
            <div class="mb-3">
                <label for="priority" class="form-label">Priority:</label>
                <select class="form-select" id="priority" name="priority" th:field="*{task.priority}">
                    <option th:value="${T(fairsource.demo.taskmanagement.models.Priority).LOW}">Low Priority</option>
                    <option th:value="${T(fairsource.demo.taskmanagement.models.Priority).NORMAL}">Normal Priority
                    </option>
                    <option th:value="${T(fairsource.demo.taskmanagement.models.Priority).URGENT}">Urgent Priority
                    </option>
                </select>
            </div>
            <div class="mb-3">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="taskDone" th:field="*{task.done}">
                    <label class="form-check-label" for="taskDone">Task Complete</label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Create</button>
        </form>

        <a href="/" class="btn btn-secondary mt-3">List all task</a>
    </div>
</section>

<!-- Bootstrap JS (Optional if you need JavaScript features) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
